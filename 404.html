<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | Compass Mediation Group</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--slate:#35354A;--terra:#C76C10;--gray:#7C7689;--cream:#FBFAF8;--ink:#2A2630;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;}
  h1{font-family:'Cormorant Garamond',Georgia,serif;color:var(--slate);font-weight:700;font-size:64px;line-height:1;margin-bottom:6px;}
  h2{font-family:'Cormorant Garamond',Georgia,serif;color:var(--slate);font-weight:700;font-size:30px;margin-bottom:14px;}
  p{font-size:17px;color:#4a4552;max-width:520px;margin:0 auto 26px;}
  .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  a.btn{display:inline-block;background:var(--terra);color:#fff;text-decoration:none;padding:13px 26px;border-radius:9px;font-weight:700;}
  a.btn.alt{background:#fff;color:var(--slate);border:1.5px solid #d7d3df;}
  a.btn:hover{filter:brightness(1.05);}
  .links{margin-top:28px;font-size:15px;color:var(--gray);}
  .links a{color:var(--terra);text-decoration:none;margin:0 9px;font-weight:700;}
</style>
</head>
<body>
  <h1>404</h1>
  <h2>We couldn't find that page</h2>
  <p>The page you're looking for may have moved or no longer exists. Let's get you back on track — you can head home, or reach out and we'll help you directly.</p>
  <div class="btns">
    <a class="btn" href="/">Back to Home</a>
    <a class="btn alt" href="/contact">Contact Us</a>
  </div>
  <div class="links">
    <a href="/faq">FAQ</a> ·
    <a href="/resources">Resources</a> ·
    <a href="/book">Book a Session</a> ·
    <a href="/pricing">Pricing</a>
  </div>
</body>
</html>
